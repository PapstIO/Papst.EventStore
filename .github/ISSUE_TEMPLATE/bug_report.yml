name: Bug report
description: Report a problem or unexpected behavior in Papst.EventStore
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.

        > **Security note:** Do not report security vulnerabilities here. Use
        > [private security advisories](https://github.com/PapstIO/Papst.EventStore/security/advisories/new) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps, code snippet, or a minimal repository that reproduces the behavior.
      placeholder: |
        1. Configure the store with '...'
        2. Append event '...'
        3. Read stream '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include exception messages if any.
    validations:
      required: true
  - type: dropdown
    id: implementation
    attributes:
      label: Affected store implementation
      description: Which package does this affect?
      options:
        - Core (Papst.EventStore)
        - AzureCosmos
        - EntityFrameworkCore
        - FileSystem
        - MongoDB
        - CodeGeneration
        - Not sure
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      description: Which version of the NuGet package(s) are you using?
      placeholder: e.g. 7.0.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: .NET version / environment
      description: .NET SDK/runtime version and OS.
      placeholder: e.g. .NET 8.0, Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or stack trace
      description: Paste any relevant log output. This is automatically formatted as code.
      render: shell
    validations:
      required: false
